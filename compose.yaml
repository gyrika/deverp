services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: simple_site
      DB_USER: cheesy_user
      DB_PASSWORD: change_this_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_change_this_password
      MYSQL_DATABASE: simple_site
      MYSQL_USER: cheesy_user
      MYSQL_PASSWORD: change_this_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_change_this_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
