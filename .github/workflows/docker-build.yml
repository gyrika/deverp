name: Docker build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config -q
      - name: Build PHP image
        run: docker build -t cheesy-bees:local .
      - name: Start stack and check login page
        run: |
          docker compose --env-file .env.example up -d
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/index.php >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env.example logs
          exit 1
      - name: Verify migration on an existing database volume
        run: |
          docker compose --env-file .env.example exec -T db sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root "$MYSQL_DATABASE" -e "DROP TABLE order_items; DROP TABLE orders;"'
          docker compose --env-file .env.example run --rm migrate
          docker compose --env-file .env.example exec -T db sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM orders;"'
      - name: Stop test stack
        if: always()
        run: docker compose --env-file .env.example down -v
